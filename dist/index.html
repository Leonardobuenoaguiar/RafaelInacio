        .atd {
          position: relative;
          overflow: hidden;
          background:
            radial-gradient(1100px 420px at 88% -10%, rgba(226,160,58,.10), transparent 60%),
            linear-gradient(180deg, #FFFFFF 0%, #FCF8F5 45%, #F7F0EA 100%);
          color: #8D4936;
          font-family: "Jost", "Questrial", "Century Gothic", "Futura",
            "Avenir Next", "Segoe UI", system-ui, sans-serif;
        }

        /* divisor sutil no lugar da barra marrom cheia */
        .atd::before {
          content: "";
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 1px;
          background: linear-gradient(
            90deg,
            transparent 0%,
            rgba(141, 73, 54, .18) 18%,
            rgba(200, 112, 58, .45) 50%,
            rgba(141, 73, 54, .18) 82%,
            transparent 100%
          );
        }

        /* marca d'agua: cerebro na cor da identidade */
        .atd-deco {
          position: absolute;
          right: -60px;
          top: 40px;
          width: 380px;
          height: auto;
          color: #8D4936;
          opacity: .06;
          pointer-events: none;
          user-select: none;
        }

        .atd-inner {
          position: relative;
          z-index: 1;
          margin: 0 auto;
          max-width: 1343px;
          padding: 64px 24px 72px;
        }

        /* ---------- cabecalho ---------- */
        .atd-eyebrow {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          margin: 0;
          color: #C8703A;
          font-size: 13px;
          font-weight: 400;
          text-transform: uppercase;
          letter-spacing: .18em;
        }
        .atd-eyebrow-line {
          display: block;
          width: 34px;
          height: 2px;
          border-radius: 2px;
          background: linear-gradient(90deg, #E2A03A, #C8703A);
        }
        .atd-title {
          margin: 14px 0 0;
          color: #8D4936;
          font-size: 38px;
          font-weight: 300;
          line-height: 1.2;
          letter-spacing: .005em;
        }
        .atd-lead {
          margin: 18px 0 0;
          max-width: 560px;
          color: #A08578;
          font-size: 16px;
          font-weight: 400;
          line-height: 1.5;
        }

        /* ---------- grid ---------- */
        .atd-grid {
          margin-top: 46px;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 24px;
          align-items: stretch;
        }
        /* o Reveal e o filho direto do grid: precisa esticar */
        .atd-grid > * {
          display: flex;
          height: 100%;
        }
        .atd-grid > * > * { width: 100%; }

        /* ---------- card ---------- */
        .atd-card {
          display: flex;
          flex-direction: column;
          width: 100%;
          height: 100%;
          padding: 30px 28px 28px;
          background-color: #FFFFFF;
          border: 1px solid rgba(141, 73, 54, .14);
          border-radius: 28px;
          box-shadow: 0 10px 30px rgba(141, 73, 54, .06);
          transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
        }
        .atd-card:hover {
          transform: translateY(-6px);
          border-color: rgba(141, 73, 54, .34);
          box-shadow: 0 18px 44px rgba(141, 73, 54, .13);
        }
        .atd-icon {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex: 0 0 auto;
          width: 58px;
          height: 58px;
          margin-bottom: 22px;
          border: 2px solid rgba(200, 112, 58, .30);
          border-radius: 50% 50% 46% 54% / 54% 48% 52% 46%;
          background: linear-gradient(140deg, rgba(226,160,58,.16), rgba(141,73,54,.10));
        }
        .atd-icon svg { width: 26px; height: 26px; }
        .atd-card-title {
          margin: 0;
          color: #8D4936;
          font-size: 23px;
          font-weight: 400;
          line-height: 1.25;
        }
        .atd-card-kicker {
          margin: 8px 0 0;
          color: #C8703A;
          font-size: 12px;
          font-weight: 400;
          text-transform: uppercase;
          letter-spacing: .15em;
        }
        .atd-card-text {
          margin: 20px 0 0;
          color: #A08578;
          font-size: 15px;
          font-weight: 400;
          line-height: 1.6;
        }
        .atd-address { font-style: normal; }
        .atd-actions {
          margin-top: auto;
          padding-top: 26px;
        }

        /* ---------- botoes ---------- */
        .atd-btn {
          display: inline-flex;
          width: 100%;
          align-items: center;
          justify-content: center;
          min-height: 46px;
          padding: 0 22px;
          border-radius: 999px;
          font-size: 15px;
          font-weight: 400;
          text-align: center;
          text-decoration: none;
          transition: background-color .25s ease, color .25s ease,
            border-color .25s ease, transform .25s ease, box-shadow .25s ease;
        }
        .atd-btn-primary {
